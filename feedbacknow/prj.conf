# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# LoRaWAN
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAMAC_REGION_US915=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Stack Sizes (increased for stability)
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=32768

# System
CONFIG_REBOOT=y
CONFIG_SPI=y

# UART
# CONFIG_SERIAL=y
# CONFIG_UART=y
# CONFIG_UART_NRFX=y
# CONFIG_UART_NRFX_UARTE=y
# CONFIG_UART_CONSOLE=y
# CONFIG_UART_INTERRUPT_DRIVEN=y
# CONFIG_UART_LINE_CTRL=y

#GPIO
CONFIG_GPIO=y

# NFC PN5180
CONFIG_PN5180=y
CONFIG_PN5180_LOG_LEVEL=4
# CONFIG_PN5180_INIT_PRIORITY=50

# Display - SSD1683 E-Paper
CONFIG_DISPLAY=y
CONFIG_SSD1683=y
CONFIG_SSD1683_LOG_LEVEL=4
# CONFIG_SSD1683_INIT_PRIORITY=90

# Disable power management on display to prevent auto-sleep
# CONFIG_PM_DEVICE=n

# LVGL Graphics Library
CONFIG_LVGL=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_INFO=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_VDB_SIZE=12
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_DPI_DEF=100
CONFIG_LV_Z_FLUSH_THREAD=n

# Display Configuration
CONFIG_DISPLAY=y
CONFIG_SSD1683=y

# LVGL Configuration
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_Z_BITS_PER_PIXEL=1

# LVGL Display Settings
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_FULL_REFRESH=y

#RTOS 
CONFIG_MULTITHREADING=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_CANARIES=y

# Memory Protection
CONFIG_MPU=y
CONFIG_ARM_MPU=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Memory Management
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Enable PMIC 
CONFIG_REGULATOR=y
CONFIG_SHELL=y
