# Basic Configuration
CONFIG_MAIN_STACK_SIZE=4096

# SPI Configuration
CONFIG_SPI=y

# GPIO Configuration
CONFIG_GPIO=y

# Logging
CONFIG_LOG=y
CONFIG_SHELL=n
CONFIG_LOG_DEFAULT_LEVEL=3

# Enable button for testing
CONFIG_RESET_COUNTER_SW0=y
CONFIG_GPIO=y

CONFIG_SPI=y
CONFIG_SPI_ASYNC=y

CONFIG_SPI_SLAVE=y

# PN5180 NFC Driver Configuration
CONFIG_PN5180=y
CONFIG_PN5180_LOG_LEVEL=3
CONFIG_PN5180_INIT_PRIORITY=80

# Threading support for NFC
CONFIG_MULTITHREADING=y


# Stack Sizes (increased for stability)
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=32768

# System
CONFIG_REBOOT=y
CONFIG_SPI=y

# GPIO
CONFIG_GPIO=y

# NFC PN5180
CONFIG_PN5180=y
# CONFIG_PN5180_LOG_LEVEL=4
# CONFIG_PN5180_INIT_PRIORITY=50

# Display - SSD1683 E-Paper
CONFIG_DISPLAY=y
CONFIG_SSD1683=y
CONFIG_SSD1683_LOG_LEVEL=4
# CONFIG_SSD1683_INIT_PRIORITY=90

# LVGL Graphics Library
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# LVGL Widgets
CONFIG_LV_USE_LABEL=y
CONFIG_LV_LABEL_TEXT_SELECTION=y
CONFIG_LV_LABEL_LONG_TXT_HINT=y
CONFIG_LV_USE_LINE=y

# RTOS
CONFIG_MULTITHREADING=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_CANARIES=y

# Memory Protection
CONFIG_MPU=y
CONFIG_ARM_MPU=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Memory Management
CONFIG_HEAP_MEM_POOL_SIZE=8192
