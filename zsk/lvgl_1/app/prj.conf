# ----------------------
# System & Memory Settings
# ----------------------
CONFIG_MAIN_STACK_SIZE=4096
# Heap: 24KB for safety (~15KB needed for 400x300@1bpp buffer)
CONFIG_HEAP_MEM_POOL_SIZE=24576

# ----------------------
# Peripheral Support
# ----------------------
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_SLAVE=y
CONFIG_GPIO=y

# ----------------------
# Logging & Shell
# ----------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y

# ----------------------
# Display
# ----------------------
CONFIG_DISPLAY=y
CONFIG_SSD1683=y

# ----------------------
# Character Framebuffer (CFB)
# ----------------------
# CONFIG_ZTEST=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n

CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_LOG=y


CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_LOG=y


