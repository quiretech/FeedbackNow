# =======================================================
# Project Configuration
# =======================================================

# ----------------------
# System & Memory Settings
# ----------------------
CONFIG_MAIN_STACK_SIZE=4096
# Heap: 32KB for CFB framebuffer + other allocations
# CFB needs ~15KB for 400x300@1bpp, plus fonts and other allocations
CONFIG_HEAP_MEM_POOL_SIZE=32768

# ----------------------
# Peripheral Support
# ----------------------
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_SLAVE=y
CONFIG_GPIO=y

# ----------------------
# Logging & Shell
# ----------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y

# ----------------------
# Display
# ----------------------
CONFIG_DISPLAY=y
CONFIG_SSD1683=y

# ----------------------



