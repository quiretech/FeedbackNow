# ========================================================
# Project Configuration
# ========================================================

# ----------------------
# System & Memory Settings
# ----------------------
CONFIG_MAIN_STACK_SIZE=4096
# Heap: 24KB for safety (~15KB needed for 400x300@1bpp buffer)
CONFIG_HEAP_MEM_POOL_SIZE=24576

# ----------------------
# Peripheral Support
# ----------------------
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_SLAVE=y

CONFIG_GPIO=y

# ----------------------
# Logging & Shell
# ----------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y

# ----------------------
# Display
# ----------------------
CONFIG_DISPLAY=y
CONFIG_SSD1683=y

# ----------------------
# LVGL (LittlevGL) Graphics Library
# ----------------------
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_Z_BITS_PER_PIXEL=1

# LVGL display settings
# Use 10% VDB (1/10th screen) to reduce memory pressure
# E-paper is slow anyway, smaller buffer is fine
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_FULL_REFRESH=y

# LVGL Font Settings
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_26=y

# ----------------------
# (Optional) Button/Testing Features
# ----------------------
# Add button/test-related configs here if needed.

