# =======================================================
# Project Configuration (SSD1683 + LVGL 9)
# =======================================================

# ----------------------
# System & Memory Settings
# ----------------------
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Increase workqueue stack for LVGL flush thread
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ----------------------
# Peripheral Support
# ----------------------
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_SLAVE=y
CONFIG_GPIO=y

# ----------------------
# Logging & Shell
# ----------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y

# ----------------------
# Display Settings
# ----------------------
CONFIG_DISPLAY=y
CONFIG_SSD1683=y
CONFIG_SSD1683_LOG_LEVEL=3
CONFIG_SSD1683_INIT_PRIORITY=80

# ----------------------
# LVGL Configuration
# ----------------------
CONFIG_LVGL=y
CONFIG_LV_USE_LOG=y

# LVGL heap size (for object creation)
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# LVGL virtual display buffer (VDB) size - increase for partial updates
CONFIG_LV_Z_VDB_SIZE=100

# Use 1-bit monochrome
CONFIG_LV_Z_BITS_PER_PIXEL=1

# Use partial rendering, avoid full refresh (prevents MPU faults)
CONFIG_LV_Z_FULL_REFRESH=y

# Use LVGL flush thread (non-blocking flush)
CONFIG_LV_Z_FLUSH_THREAD=y

# LVGL buffer thread priority (optional)
CONFIG_LV_Z_FLUSH_THREAD_PRIORITY=5

# ----------------------
# Optional LVGL optimizations
# ----------------------
# Reduce unused features to save RAM
