# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y


# LoRaWAN
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAMAC_REGION_US915=y
# CONFIG_LORAMAC_REGION_EU868=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_LORA_SX126X=y
# CONFIG_LORA_LOG_LEVEL_DBG=y

# Stack Sizes
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# System
CONFIG_REBOOT=y
CONFIG_SPI=y

# I2C (for PCF8523 RTC)
CONFIG_I2C=y

# EEPROM (AT24-compatible I2C EEPROM like 24LC512/24AA512)
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y

# GPIO (buttons)
CONFIG_GPIO=y

# CRC (used for EEPROM record integrity)
CONFIG_CRC=y

# RTC (optional; required only if an RTC node exists in DTS)
CONFIG_RTC=y
CONFIG_RTC_PCF8523=y


# CONFIG_BOOT_DELAY=5000

