# Logging (Step 8: Optimize for power savings)
# CONFIG_LOG=y
# Use deferred logging mode - logs are buffered and processed in batches
# This reduces UART activity and allows CPU to sleep more
# CONFIG_LOG_MODE_DEFERRED=y
# Reduce log level to WRN/ERR only for production (reduces logging overhead)
# Change to CONFIG_LOG_DEFAULT_LEVEL_DBG=4 for full debugging
# CONFIG_LOG_DEFAULT_LEVEL=2


# LoRaWAN
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAMAC_REGION_US915=y
# CONFIG_LORAMAC_REGION_EU868=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_LORA_SX126X=y
# CONFIG_LORA_LOG_LEVEL_DBG=y

# Stack Sizes
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# System
CONFIG_REBOOT=y
CONFIG_SPI=y

# Power Management (Step 1: Enable tickless idle)
# Enable tickless kernel for deep sleep during idle
# This allows CPU to enter System ON sleep mode when threads call k_sleep()
CONFIG_TICKLESS_KERNEL=y
# Note: PM_DEVICE_RUNTIME removed - it was causing I2C device initialization issues
# Basic tickless idle provides 99%+ power savings without runtime PM

# I2C (for PCF8523 RTC)
CONFIG_I2C=y

# EEPROM (AT24-compatible I2C EEPROM like 24LC512/24AA512)
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y

# GPIO (buttons)
CONFIG_GPIO=y

# CRC (used for EEPROM record integrity)
CONFIG_CRC=y

# RTC (optional; required only if an RTC node exists in DTS)
CONFIG_RTC=y
CONFIG_RTC_PCF8523=y


# CONFIG_BOOT_DELAY=5000

