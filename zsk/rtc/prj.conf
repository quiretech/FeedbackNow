# ==========================
# I2C configuration
# ==========================
CONFIG_I2C=y
CONFIG_I2C_NRFX=y
CONFIG_I2C_SHELL=y

# ==========================
# RTC configuration (PCF8523)
# ==========================
CONFIG_RTC=y

# ==========================
# UART / Serial console
# ==========================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# (Optional) Enable line control features (e.g. for USB CDC ACM)
# CONFIG_UART_LINE_CTRL=y

# ==========================
# Zephyr shell configuration
# ==========================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Custom shell prompt
CONFIG_SHELL_PROMPT_UART="shell> "

# (Optional but recommended for larger commands)
CONFIG_SHELL_STACK_SIZE=4096

# ==========================
# Logging
# ==========================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
