# Core peripherals
CONFIG_SPI=y
CONFIG_GPIO=y

# Logging / shell
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y

# Display
CONFIG_DISPLAY=y
CONFIG_SSD1683=y

# Threading / memory safety
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_MULTITHREADING=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_MPU=y
CONFIG_ARM_MPU=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# LVGL - 1 bpp mono for the EPD
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_MONOCHROME_CONVERSION_BUFFER=y

# Memory pools
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# LVGL partial-render buffer at 25% of screen. Forces LVGL into
# partial rendering mode (buf < screen) so flush_cb is called with
# the actual dirty subrects. Our driver coalesces multiple flushes
# into one EPD refresh via the shadow framebuffer.
CONFIG_LV_Z_VDB_SIZE=25

# Widgets
CONFIG_LV_USE_LABEL=y
CONFIG_LV_LABEL_TEXT_SELECTION=y
CONFIG_LV_LABEL_LONG_TXT_HINT=y
CONFIG_LV_USE_LINE=y
