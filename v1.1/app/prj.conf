# --- 1. System & Kernel ---
CONFIG_MULTITHREADING=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- 2. Hardware Bus Drivers ---
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_ADC=y

# --- 3. External Peripherals ---
# NFC (PN5180)
CONFIG_PN5180=y

# RTC (PCF8523)
CONFIG_RTC=y
CONFIG_RTC_PCF8523=y

# EEPROM (AT24)
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y
CONFIG_CRC=y

# --- 4. Display & Graphics (SSD1683 E-Paper) ---
CONFIG_DISPLAY=y
CONFIG_SSD1683=y

# CONFIG_LVGL=y
# CONFIG_LV_Z_MEM_POOL_SIZE=32768
# CONFIG_LV_USE_LABEL=y
# CONFIG_LV_LABEL_TEXT_SELECTION=y
# CONFIG_LV_LABEL_LONG_TXT_HINT=y
# CONFIG_LV_USE_LINE=y
# CONFIG_LV_FONT_FMT_TXT_LARGE=y

# --- 5. LoRaWAN Stack ---
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAMAC_REGION_US915=y
CONFIG_LORA_SX126X=y
# Using a real random generator is better for security, but keeping yours for now:
CONFIG_TEST_RANDOM_GENERATOR=y

# --- 6. Security & Stability ---
CONFIG_MPU=y
CONFIG_ARM_MPU=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_CANARIES=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# --- 7. Logging & Console (Optimized) ---
CONFIG_LOG=y
# Set to DEFERRED for production power savings; IMMEDIATE is for debugging only.
CONFIG_LOG_MODE_DEFERRED=y 
CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_SERIAL=y
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y



# Enable Tracing
CONFIG_TRACING=y
CONFIG_SEGGER_SYSTEMVIEW=y

# SystemView requires RTT (Real-Time Transfer)
CONFIG_USE_SEGGER_RTT=y
# CONFIG_HAS_SEGGER_RTT=y

# Optional: Increase RTT buffer size if you have many threads (like LoRa + LVGL)
CONFIG_SEGGER_RTT_SECTION_NONE=y
CONFIG_SEGGER_SYSVIEW_RTT_BUFFER_SIZE=4096