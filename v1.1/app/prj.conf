# --- 1. System & Kernel ---
CONFIG_MULTITHREADING=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y
# hwinfo: reset-cause read for commissioning-boot gating (see boot_info.c)
CONFIG_HWINFO=y
# Optimization for production
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# --- 2. Hardware Bus Drivers ---
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y

# --- 3. External Peripherals ---
# PN5180 / SSD1683 / LVGL: prj_flexbox.conf or prj_flexbox_plus.conf (CMake picks
# from onboarding_config.h DEVICE_HW_VARIANT).
CONFIG_RTC=y
CONFIG_RTC_PCF8523=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y
CONFIG_CRC=y

# --- 4. LoRaWAN Stack ---
CONFIG_LORA=y
CONFIG_LORAWAN=y
# BEGIN LORAWAN_REGION (gen_euis.py)
CONFIG_LORAMAC_REGION_US915=y
# CONFIG_LORAMAC_REGION_EU868=y
# END LORAWAN_REGION (gen_euis.py)
CONFIG_LORA_SX126X=y
# Helpful for handling downlinks and MAC commands properly
CONFIG_LORAWAN_SERVICES=y

# --- 5. Security & Stability ---
CONFIG_MPU=y
CONFIG_ARM_MPU=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_STACK_CANARIES=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y
# Stack depth verification: logs per-thread max stack use (see sys_config stacks).
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_USE_LOG=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=3600

# --- Log verbosity (see include/log_fmt.h).
# Levels: 4=DBG 3=INF 2=WRN 1=ERR.
# Default 3: LOG_STATE (subsystem) + LOG_EVT (telemetry) + WRN/ERR.
# Full DBG trace: CONFIG_LOG_DEFAULT_LEVEL=4
# ERR-only production: CONFIG_LOG_DEFAULT_LEVEL=1
# CONFIG_LORAWAN_LOG_LEVEL_WRN=y

# --- 6. Logging & Console (Production Silence) ---
# Disable serial and console to save significant battery power
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Thread analyzer + boot burst fill the default ring; avoid "--- N messages dropped ---".
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536

# --- 7. Power Management & Debug ---
# CONFIG_PM/CONFIG_PM_DEVICE: not satisfied on nRF52840 in Zephyr 4.x (SoC deps); omit to avoid Kconfig warning.
# CONFIG_STACK_SENTINEL: mutually exclusive with CONFIG_MPU_STACK_GUARD (we use MPU stack guard).
CONFIG_PM=y
CONFIG_PM_DEVICE=y

