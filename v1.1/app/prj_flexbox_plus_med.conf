# FLEXBOX_PLUS_MED variant — EPD (SSD1683), LVGL (paired with
# DEVICE_HW_VARIANT FLEXBOX_PLUS_MED in onboarding_config.h; CMake appends this
# fragment automatically).

CONFIG_PN5180=n
CONFIG_DISPLAY=y
CONFIG_SSD1683=y

CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_FMT_TXT_LARGE=y
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_DPI_DEF=100

CONFIG_SSD1683_LOG_LEVEL=1
#CONFIG_PN5180_LOG_LEVEL=1
