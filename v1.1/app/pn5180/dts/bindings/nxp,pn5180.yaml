description: NXP PN5180 NFC Reader

compatible: "nxp,pn5180"

include: spi-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description: GPIO specifier for the IRQ pin

  rst-gpios:
    type: phandle-array
    required: true
    description: GPIO specifier for the reset pin

  busy-gpios:
    type: phandle-array
    required: true
    description: GPIO specifier for the busy pin

  nss-gpios:
    type: phandle-array
    required: true
    description: GPIO specifier for the chip select pin

  timeout-ms:
    type: int
    default: 1000
    description: Command timeout in milliseconds