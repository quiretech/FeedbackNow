<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoRaWAN Converter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0e17;
    --panel: #111827;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --green: #00ff9d;
    --text: #e2e8f0;
    --muted: #4a5568;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    background-image: radial-gradient(ellipse at 20% 20%, #0d1f3c 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, #1a0a2e 0%, transparent 50%);
  }

  h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 36px;
    letter-spacing: 1px;
  }

  .container {
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    background: #070c14;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    padding: 14px;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.6;
  }

  textarea:focus { border-color: var(--accent); }

  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 8px;
  }

  .hint span { color: var(--accent2); }

  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 1px;
    padding: 12px 28px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
  }
  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .btn-copy {
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 8px 18px;
    font-size: 0.75rem;
  }
  .btn-copy:hover { background: var(--green); color: #000; }
  .btn-copy.copied { background: var(--green); color: #000; }

  .output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .output-area {
    background: #070c14;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    line-height: 1.8;
    white-space: pre;
    overflow-x: auto;
    min-height: 80px;
    color: #a0aec0;
  }

  .device-block { margin-bottom: 28px; }

  .device-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .kw  { color: #7c3aed; }
  .mac { color: #00d4ff; }
  .hex { color: #00ff9d; }
  .punc { color: #4a5568; }

  .error {
    color: #fc8181;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    padding: 10px;
    background: #1a0a0a;
    border: 1px solid #7f1d1d;
    border-radius: 6px;
    margin-top: 8px;
  }

  .count-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    background: #1e2d45;
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 20px;
  }
</style>
</head>
<body>

<h1>LoRaWAN CSV → C Defines</h1>
<p class="subtitle">// paste csv rows → get copy-paste ready header defines</p>
<p class="subtitle" style="margin-top:-28px;margin-bottom:0;max-width:820px;line-height:1.5">11-byte uplink decode: <span>helpers/parse_payload.py</span> (EVT 0x13 → FPort 20 HK; 0x14 → FPort 21 after DL 0x08 fw/hw version query).</p>

<div class="container">

  <div class="card">
    <label>CSV Input</label>
    <textarea id="csvInput" placeholder="UNIT-0236,464C58AB0A824A5E,BA1865CA36A6C346,F0D626CD48BAADBB3785432326873F2D
UNIT-0237,AABBCCDDEEFF0011,1122334455667788,00112233445566778899AABBCCDDEEFF"></textarea>
    <p class="hint">Format: <span>UNIT_NAME, DEV_EUI (16 hex), JOIN_EUI (16 hex), APP_KEY (32 hex)</span></p>
  </div>

  <div class="btn-row">
    <button class="btn-primary" onclick="convert()">Convert</button>
    <button class="btn-secondary" onclick="clearAll()">Clear</button>
  </div>

  <div class="card" id="outputCard" style="display:none">
    <div class="output-header">
      <label style="margin:0">Output <span id="countBadge" class="count-badge"></span></label>
      <button class="btn-copy" id="copyAllBtn" onclick="copyAll()">Copy All</button>
    </div>
    <div class="output-area" id="outputArea"></div>
  </div>

</div>

<script>
  function hexToBytes(hex) {
    hex = hex.replace(/\s/g, '');
    if (hex.length % 2 !== 0) throw new Error(`Odd hex length: ${hex}`);
    const bytes = [];
    for (let i = 0; i < hex.length; i += 2) {
      bytes.push('0x' + hex.slice(i, i+2).toLowerCase());
    }
    return bytes;
  }

  function formatDefine(name, bytes, perRow) {
    const indent = '    ';
    if (bytes.length <= perRow) {
      return `#define ${name} \\\n  { ${bytes.join(', ')} }`;
    }
    // multi-row (APP_KEY)
    const rows = [];
    for (let i = 0; i < bytes.length; i += perRow) {
      rows.push(bytes.slice(i, i + perRow).join(', '));
    }
    const inner = rows.map((r, i) => {
      if (i === 0) return `    ${r},`;
      if (i === rows.length - 1) return `        ${r}`;
      return `        ${r},`;
    }).join(' \\\n');
    return `#define ${name} \\\n  {                                                                            \\\n${inner} \\\n  }`;
  }

  function convert() {
    const raw = document.getElementById('csvInput').value.trim();
    if (!raw) return;

    const lines = raw.split('\n').filter(l => l.trim());
    const errors = [];
    const blocks = [];
    const rawBlocks = [];

    lines.forEach((line, idx) => {
      const parts = line.trim().split(',').map(p => p.trim());
      if (parts.length < 4) {
        errors.push(`Line ${idx+1}: expected 4 columns, got ${parts.length}`);
        return;
      }
      const [name, devEui, joinEui, appKey] = parts;

      try {
        const devBytes  = hexToBytes(devEui);
        const joinBytes = hexToBytes(joinEui);
        const appBytes  = hexToBytes(appKey);

        if (devBytes.length !== 8)  throw new Error(`DEV_EUI must be 8 bytes, got ${devBytes.length}`);
        if (joinBytes.length !== 8) throw new Error(`JOIN_EUI must be 8 bytes, got ${joinBytes.length}`);
        if (appBytes.length !== 16) throw new Error(`APP_KEY must be 16 bytes, got ${appBytes.length}`);

        const raw =
          `/* ${name} */\n` +
          `#define LORAWAN_DEV_EUI                                                        \\\n` +
          `  { ${devBytes.join(', ')} }\n\n` +
          `#define LORAWAN_JOIN_EUI                                                       \\\n` +
          `  { ${joinBytes.join(', ')} }\n\n` +
          `#define LORAWAN_APP_KEY                                                        \\\n` +
          `  {                                                                            \\\n` +
          `    ${appBytes.slice(0,8).join(', ')},    \\\n` +
          `        ${appBytes.slice(8).join(', ')}                                                 \\\n` +
          `  }`;

        rawBlocks.push(raw);

        // syntax-highlighted version
        const hl =
          `<span class="punc">/* </span><span class="mac">${name}</span><span class="punc"> */</span>\n` +
          `<span class="kw">#define</span> LORAWAN_DEV_EUI                                                        \\\n` +
          `  <span class="punc">{</span> ${devBytes.map(b=>`<span class="hex">${b}</span>`).join(', ')} <span class="punc">}</span>\n\n` +
          `<span class="kw">#define</span> LORAWAN_JOIN_EUI                                                       \\\n` +
          `  <span class="punc">{</span> ${joinBytes.map(b=>`<span class="hex">${b}</span>`).join(', ')} <span class="punc">}</span>\n\n` +
          `<span class="kw">#define</span> LORAWAN_APP_KEY                                                        \\\n` +
          `  <span class="punc">{</span>                                                                            \\\n` +
          `    ${appBytes.slice(0,8).map(b=>`<span class="hex">${b}</span>`).join(', ')},    \\\n` +
          `        ${appBytes.slice(8).map(b=>`<span class="hex">${b}</span>`).join(', ')}                                                 \\\n` +
          `  <span class="punc">}</span>`;

        blocks.push({ name, hl, raw });

      } catch(e) {
        errors.push(`Line ${idx+1} (${name}): ${e.message}`);
      }
    });

    const outputArea = document.getElementById('outputArea');
    const outputCard = document.getElementById('outputCard');
    outputCard.style.display = 'block';

    let html = '';
    blocks.forEach((b, i) => {
      html += `<div class="device-block">${b.hl}</div>`;
      if (i < blocks.length - 1) html += '\n';
    });

    if (errors.length) {
      html += errors.map(e => `<div class="error">⚠ ${e}</div>`).join('');
    }

    outputArea.innerHTML = html;
    document.getElementById('countBadge').textContent = `${blocks.length} device${blocks.length !== 1 ? 's' : ''}`;

    // store raw for copy
    outputArea._rawText = rawBlocks.join('\n\n');
  }

  function copyAll() {
    const outputArea = document.getElementById('outputArea');
    const text = outputArea._rawText || outputArea.innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyAllBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy All'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function clearAll() {
    document.getElementById('csvInput').value = '';
    document.getElementById('outputCard').style.display = 'none';
    document.getElementById('outputArea').innerHTML = '';
  }
</script>
</body>
</html>
