  {name:'SFO UNIT-0042',deveui:'464c588f47ca18e1',id:'78e2fcfe',last:'2026-04-28T20:24:09'},
  {name:'SFO UNIT-0108',deveui:'464c58c7d0486dd6',id:'a44f0388',last:'2026-04-28T20:24:42'},
  {name:'SFO UNIT-0174',deveui:'464c580c7ff97d8b',id:'5f5446a7',last:'2026-04-28T20:24:55'},
  {name:'041C4688350C',deveui:'464c584c4688350c',id:'46370e1e',last:'2026-04-28T20:25:48',noname:true},
  {name:'SFO UNIT-0126',deveui:'464c58212a778de5',id:'e1ba59d4',last:'2026-04-28T20:25:56'},
];

function classify(d) {
  if (!d.last) return 'never';
  const days = daysSince(d.last);
  if (days <= 1) return 'today';
  if (days <= 7) return 'week';
  if (days <= 30) return 'month';
  if (days <= 70) return 'stale60';
  return 'stale70';
}

const devices = RAW.map(d => ({ ...d, cat: classify(d), days: daysSince(d.last) }));

const CATS = {
  all: { label: 'All', color: '' },
  today: { label: 'Today', color: '#3B6D11' },
  week: { label: 'This week', color: '#185FA5' },
  month: { label: 'This month', color: '#185FA5' },
  stale60: { label: '30-70 days', color: '#854F0B' },
  stale70: { label: '70+ days', color: '#993C1D' },
  never: { label: 'Never heard', color: '#A32D2D' },
  noname: { label: 'No name', color: '#534AB7' },
  special: { label: 'Notable', color: '#636' },
};

function counts() {
  return {
    all: devices.length,
    today: devices.filter(d=>d.cat==='today').length,
    week: devices.filter(d=>d.cat==='week').length,
    month: devices.filter(d=>d.cat==='month').length,
    stale60: devices.filter(d=>d.cat==='stale60').length,
    stale70: devices.filter(d=>d.cat==='stale70').length,
    never: devices.filter(d=>d.cat==='never').length,
    noname: devices.filter(d=>d.noname).length,
    special: devices.filter(d=>d.special).length,
  };
}

const c = counts();
const activeCount = c.today + c.week + c.month;
const pctActive = Math.round(activeCount / c.all * 100);
const pctNever = Math.round(c.never / c.all * 100);

document.getElementById('metrics').innerHTML = `
  <div class="metric"><div class="metric-label">Total devices</div><div class="metric-value">${c.all}</div></div>
  <div class="metric"><div class="metric-label">Active today</div><div class="metric-value" style="color:#27500A">${c.today}</div><div class="metric-sub">Heard Apr 28</div></div>
  <div class="metric"><div class="metric-label">This week</div><div class="metric-value" style="color:#3B6D11">${c.week}</div><div class="metric-sub">Apr 21–27</div></div>
  <div class="metric"><div class="metric-label">This month</div><div class="metric-value" style="color:#185FA5">${c.month}</div><div class="metric-sub">Apr 1–20</div></div>
  <div class="metric"><div class="metric-label">30–70 days ago</div><div class="metric-value" style="color:#854F0B">${c.stale60}</div><div class="metric-sub">Feb 27 – Mar</div></div>
  <div class="metric"><div class="metric-label">70+ days stale</div><div class="metric-value" style="color:#993C1D">${c.stale70}</div><div class="metric-sub">Before Feb 27</div></div>
  <div class="metric"><div class="metric-label">Never heard</div><div class="metric-value" style="color:#A32D2D">${c.never}</div><div class="metric-sub">${pctNever}% of fleet</div></div>
  <div class="metric"><div class="metric-label">No proper name</div><div class="metric-value" style="color:#534AB7">${c.noname}</div><div class="metric-sub">Raw DevEUI</div></div>
`;

let currentFilter = 'all';
const tabBar = document.getElementById('tabBar');
tabBar.innerHTML = Object.entries(CATS).map(([k, v]) => {
  const n = k === 'noname' ? c.noname : k === 'special' ? c.special : (c[k] ?? c.all);
  return `<button class="tab ${k==='all'?'active':''}" onclick="setFilter('${k}', this)">${v.label} (${n})</button>`;
}).join('');

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function badgeClass(d) {
  if (d.cat==='never') return 'b-never';
  if (d.cat==='stale70') return 'b-stale70';
  if (d.cat==='stale60') return 'b-stale60';
  if (d.cat==='month') return 'b-month';
  if (d.cat==='week') return 'b-week';
  return 'b-today';
}
function badgeLabel(d) {
  if (d.cat==='never') return 'never heard';
  if (d.cat==='stale70') return `${d.days}d ago`;
  if (d.cat==='stale60') return `${d.days}d ago`;
  if (d.cat==='month') return `${d.days}d ago`;
  if (d.cat==='week') return `${d.days}d ago`;
  return 'today';
}
function lastLabel(d) {
  if (!d.last) return '—';
  return new Date(d.last).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function render() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const sort = document.getElementById('sortSel').value;

  let filtered = devices.filter(d => {
    if (currentFilter === 'noname') return d.noname;
    if (currentFilter === 'special') return d.special;
    if (currentFilter !== 'all' && d.cat !== currentFilter) return false;
    if (search && !d.name.toLowerCase().includes(search) && !d.deveui.includes(search) && !d.id.includes(search)) return false;
    return true;
  });

  const ORDER = {never:0, stale70:1, stale60:2, month:3, week:4, today:5};
  if (sort === 'status') filtered.sort((a,b) => ORDER[a.cat]-ORDER[b.cat]);
  else if (sort === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name));
  else if (sort === 'last_asc') filtered.sort((a,b) => (a.days??9999)-(b.days??9999));
  else if (sort === 'last_desc') filtered.sort((a,b) => (b.days??9999)-(a.days??9999));

  document.getElementById('countLabel').textContent = `Showing ${filtered.length} of ${c.all} devices`;

  document.getElementById('tbody').innerHTML = filtered.map(d => `
    <tr>
      <td style="font-weight:500">${d.name}${d.special?`<span class="special-label">${d.special}</span>`:''}</td>
      <td><span class="badge ${badgeClass(d)}">${badgeLabel(d)}</span>${d.noname?` <span class="badge" style="background:#EEEDFE;color:#534AB7">no name</span>`:''}</td>
      <td style="color:var(--color-text-secondary);white-space:nowrap">${lastLabel(d)}</td>
      <td class="deveui">${d.deveui}</td>
    </tr>
  `).join('');

  const totalActive = c.today + c.week + c.month;
  document.getElementById('summaryNote').innerHTML =
    `<strong>${pctActive}% active</strong> (heard in last 30 days: ${totalActive}/${c.all} devices) &nbsp;·&nbsp; ` +
    `<strong>${pctNever}% never heard</strong> (${c.never} devices — prime delete candidates) &nbsp;·&nbsp; ` +
    `Notable: 1 test device (<em>tmobile test device</em>), 3 Northstar units, 1 Kraft unit, 1 Flexbox_Seaworld. ` +
    `"SFO Unit-37" appears twice with different DevEUIs — one active today, one stale since Feb 17.`;
}

render();
</script>
